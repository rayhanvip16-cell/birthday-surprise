
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffb6d9, #c8a2ff);
      overflow: hidden;
      color: white;
    }

    .container {
      padding: 30px;
      z-index: 2;
    }

    .heart {
      font-size: 75px;
      animation: beat 1s infinite;
    }

    h1 {
      font-size: 42px;
      margin: 20px 0;
      text-shadow: 2px 3px 8px #a45c9b;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      margin-bottom: 30px;
    }

    button {
      background: white;
      color: #d65caa;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background: #ffe4f3;
    }

    .floating {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: floatUp 7s linear infinite;
      opacity: 0.7;
    }

    @keyframes beat {
      50% { transform: scale(1.2); }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 { font-size: 32px; }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="heart">💗</div>

    <h1>Happy Birthday!</h1>

    <h2>Dear Someone Special ❤️</h2>

    <p>
      Today is your special day.
      I have prepared something for you!
    </p>

    <button onclick="openSurprise()">
      Open Your Surprise ✨
    </button>
  </div>

  <script>
    function openSurprise() {
      alert("Your special surprise is coming! ❤️");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating";
      heart.innerHTML = "💗";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration =
        (Math.random() * 4 + 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 9000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
